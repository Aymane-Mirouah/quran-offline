name: quran_player
description: Quran MP3 Player
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.17
  provider: ^6.1.2
  dynamic_color: ^1.9.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  dio: ^5.0.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icon/